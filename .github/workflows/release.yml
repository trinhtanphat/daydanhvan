name: Release

on:
  workflow_run:
    workflows: ["iOS"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  release-v0-1-0:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Require matching CI success
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            conclusion="$(gh run list --workflow CI --commit "$RELEASE_SHA" --limit 1 --json conclusion --jq '.[0].conclusion // ""')"
            if [[ "$conclusion" == "success" ]]; then exit 0; fi
            if [[ "$conclusion" == "failure" || "$conclusion" == "cancelled" ]]; then
              echo "CI conclusion is $conclusion" >&2
              exit 1
            fi
            sleep 15
          done
          echo 'Timed out waiting for CI success' >&2
          exit 1
      - name: Verify package version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          [[ "$VERSION" == "0.1.0" ]] || { echo "Unexpected version: $VERSION" >&2; exit 1; }
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create tag and GitHub Release if absent
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; release workflow is idempotent."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" "$RELEASE_SHA" -m "Dạy đánh vần $TAG"
          git push origin "$TAG"
          gh release create "$TAG" --target "$RELEASE_SHA" --title "Dạy đánh vần $TAG" --notes-file CHANGELOG.md

  ios-release-tagged:
    name: iOS Release v0.1.0
    needs: release-v0-1-0
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.1.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.1.0
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck mobile
        run: pnpm --filter @daydanhvan/mobile typecheck
      - name: Generate iOS project from tag
        run: pnpm --filter @daydanhvan/mobile exec expo prebuild --platform ios --non-interactive --clean
      - name: Install CocoaPods
        run: |
          cd apps/mobile/ios
          pod install
      - name: Build tagged iOS Release simulator app
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(find apps/mobile/ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [[ -z "$WORKSPACE" ]]; then echo 'No xcworkspace generated' >&2; exit 1; fi
          SCHEME="$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); s=(d.get("workspace",{}).get("schemes") or d.get("project",{}).get("schemes") or []); print(s[0] if s else "")')"
          if [[ -z "$SCHEME" ]]; then echo 'No build scheme found' >&2; exit 1; fi
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package tagged Release app
        id: package
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then echo 'Release .app not found' >&2; exit 1; fi
          ZIP_PATH="$RUNNER_TEMP/daydanhvan-ios-${RELEASE_TAG}-simulator.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"
          echo "zip=$ZIP_PATH" >> "$GITHUB_OUTPUT"
      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: daydanhvan-ios-Release-v0.1.0
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error
          retention-days: 30
      - name: Attach tagged iOS build to GitHub Release
        shell: bash
        run: gh release upload "$RELEASE_TAG" "${{ steps.package.outputs.zip }}" --clobber
