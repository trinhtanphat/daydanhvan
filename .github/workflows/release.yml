name: Release

on:
  workflow_run:
    workflows: ["iOS"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  create-release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Require matching CI success
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            conclusion="$(gh run list --workflow CI --commit "$RELEASE_SHA" --limit 1 --json conclusion --jq '.[0].conclusion // ""')"
            if [[ "$conclusion" == "success" ]]; then exit 0; fi
            if [[ "$conclusion" == "failure" || "$conclusion" == "cancelled" ]]; then
              echo "CI conclusion is $conclusion" >&2
              exit 1
            fi
            sleep 15
          done
          echo 'Timed out waiting for CI success' >&2
          exit 1
      - name: Require matching Android success
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            conclusion="$(gh run list --workflow Android --commit "$RELEASE_SHA" --limit 1 --json conclusion --jq '.[0].conclusion // ""')"
            if [[ "$conclusion" == "success" ]]; then exit 0; fi
            if [[ "$conclusion" == "failure" || "$conclusion" == "cancelled" ]]; then
              echo "Android conclusion is $conclusion" >&2
              exit 1
            fi
            sleep 15
          done
          echo 'Timed out waiting for Android success' >&2
          exit 1
      - name: Resolve semantic version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid semantic version: $VERSION" >&2; exit 1; }
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create tag if absent
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            TARGET="$(git rev-list -n 1 "$TAG")"
            [[ "$TARGET" == "$RELEASE_SHA" ]] || { echo "$TAG already points to $TARGET, expected $RELEASE_SHA" >&2; exit 1; }
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" "$RELEASE_SHA" -m "Dạy đánh vần $TAG"
            git push origin "$TAG"
          fi
      - name: Create GitHub Release if absent
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$RELEASE_SHA" --title "Dạy đánh vần $TAG" --notes-file CHANGELOG.md
          fi

  mobile-binaries:
    name: Package Android + iOS binaries
    needs: create-release
    uses: ./.github/workflows/mobile-release.yml
    with:
      tag: ${{ needs.create-release.outputs.tag }}
    secrets: inherit
