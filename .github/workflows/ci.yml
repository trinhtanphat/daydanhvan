name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: write

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Commit generated lockfile once
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/v0.1.0'
        shell: bash
        run: |
          set -euo pipefail
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'pnpm-lock.yaml is already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: lock pnpm dependencies'
          git push origin HEAD:feat/v0.1.0
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build web
        run: pnpm build:web
      - name: Build admin
        run: pnpm build:admin
      - name: Worker dry run
        run: pnpm build:worker
      - name: Secret-pattern guard
        run: |
          if git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- ':!docs/**'; then
            echo 'Private key material found in repository.' >&2
            exit 1
          fi
          if git grep -nE 'CLOUDFLARE_API_TOKEN[=:][[:space:]]*"?[A-Za-z0-9_-]{20,}' -- ':!docs/**'; then
            echo 'Possible literal Cloudflare API token found in repository.' >&2
            exit 1
          fi
          if git grep -nE 'APPLE_CERTIFICATE_P12_BASE64[=:][[:space:]]*"?[A-Za-z0-9+/=]{40,}' -- ':!docs/**'; then
            echo 'Possible literal Apple certificate material found in repository.' >&2
            exit 1
          fi
